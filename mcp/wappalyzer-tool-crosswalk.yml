source: mcp/wappalyzer-mcp.yml + openapi/*.yml
description: >-
  Binds each published Wappalyzer MCP tool and resource to its backing OpenAPI operation, so an
  agent inherits a real input contract from the spec rather than a guessed one. The live MCP
  tools/list is OAuth-gated (HTTP 401, scope mcp:tools), so tool names, descriptions and
  parameters come from the provider's own MCP docs and the README of its open-source stdio
  server — both first-party — and are mapped by name and semantics against the specs in
  openapi/. Confidence reflects that.

surfaces:
  openapi:
    files:
      - openapi/wappalyzer-basics-api-openapi.yml
      - openapi/wappalyzer-lookup-api-openapi.yml
      - openapi/wappalyzer-lists-api-openapi.yml
      - openapi/wappalyzer-subdomains-api-openapi.yml
      - openapi/wappalyzer-verify-api-openapi.yml
      - openapi/wappalyzer-metadata-api-openapi.yml
    base: https://api.wappalyzer.com/v2
    gated: false
    note: REST is API-key gated at call time (x-api-key) except the metadata endpoints.
  mcp:
    url: https://mcp.wappalyzer.com/mcp
    transport: Streamable HTTP
    gated: true
    note: tools/list returns 401 invalid_token; OAuth 2.1 with scope mcp:tools required.
  graphql:
    present: false
    note: No GraphQL surface. https://api.wappalyzer.com/graphql returns 403 Missing Authentication Token (API Gateway catch-all, not a GraphQL endpoint).

crosswalk:
  - tool: lookup_site
    category: technology-detection
    rest: [lookupWebsites]
    spec: openapi/wappalyzer-lookup-api-openapi.yml
    binding: rest
    confidence: high
    note: >-
      Same endpoint (GET /lookup). The tool narrows the operation: `url` maps to the `urls`
      query parameter but accepts exactly one value where REST accepts up to ten, and
      `recursive` is pinned to false, so the tool cannot trigger the 5-credit async crawl path.
      `live`, `sets`, `denoise` and `max_age` pass through unchanged. REST-only parameters not
      exposed by the tool: callback_url, debug_email, min_age, squash, recursive.

  - tool: lookup_subdomains
    category: asset-discovery
    rest: [lookupSubdomains]
    spec: openapi/wappalyzer-subdomains-api-openapi.yml
    binding: rest
    confidence: high
    note: >-
      Same endpoint (GET /subdomains). Tool adds client-side validation the REST surface does
      not document: limit must be 10-1000 and a multiple of 10, and exactly one domain.

  - tool: get_credit_balance
    category: account
    rest: [getCreditBalance]
    spec: openapi/wappalyzer-basics-api-openapi.yml
    binding: rest
    confidence: high
    note: Same endpoint (GET /credits/balance). No inputs on either side.

