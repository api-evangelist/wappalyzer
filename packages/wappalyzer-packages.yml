description: >-
  Wappalyzer publishes no current, maintained first-party client SDK for its v2 REST API. The one
  package the company itself owns on any registry — the npm `wappalyzer` module — was deprecated
  by the vendor in 2023 with a description that redirects users to the API. The only actively
  maintained first-party code artifact is the open-source MCP server, which is not published to
  any registry and installs from a git clone. Every other registry entry under the name
  "wappalyzer" is a third-party reimplementation and is recorded here as unofficial so it is not
  mistaken for vendor support.

packages:
  - language: javascript
    registry: npm
    name: wappalyzer
    url: https://www.npmjs.com/package/wappalyzer
    install: npm install wappalyzer
    official: true
    deprecated: true
    version: 7.0.3
    published: '2023-08-23'
    repository: null
    note: >-
      First-party (npm maintainer account `wappalyzer`, homepage www.wappalyzer.com). The package
      description now reads verbatim: "This package is no longer being maintained. Please use the
      API at wappalyzer.com/api instead." 217 versions published between 2015-01-04 and
      2023-08-23; nothing since. This was the self-hosted detection engine, not a client for the
      v2 REST API — so there is no first-party SDK for the API this repo profiles. Last release
      predates the v2 API surface documented at /docs/api/v2/.

  - language: javascript
    registry: github
    name: wappalyzer-mcp
    url: https://github.com/wappalyzer/mcp
    install: git clone https://github.com/wappalyzer/mcp && npm install
    official: true
    version: 0.1.0
    published: null
    license: MIT
    note: >-
      First-party local stdio MCP server wrapping the v2 REST API. Version read from
      package.json in the repo (master). `published: null` because it is NOT on any registry —
      package.json carries "private": true, and registry.npmjs.org returns 404 for both
      `wappalyzer-mcp` and `@wappalyzer/mcp`, so there is no registry metadata endpoint to date
      it. Requires Node.js >= 20 and a WAPPALYZER_API_KEY environment variable. Repository last
      pushed 2026-03-21. This is the closest thing Wappalyzer ships to a maintained client
      library, and it is distributed only as source.

  - language: python
    registry: pypi
    name: wappalyzer
    url: https://pypi.org/project/wappalyzer/
    install: pip install wappalyzer
    official: false
    version: 2.0.2
