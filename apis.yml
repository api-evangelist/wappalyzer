- aid: wappalyzer:wappalyzer-mcp
  name: Wappalyzer MCP Server
  description: >-
    First-party hosted Model Context Protocol server at https://mcp.wappalyzer.com/mcp — remote
    Streamable HTTP, OAuth 2.1 with PKCE and dynamic client registration, exposing three
    read-only tools and four metadata resources. A first-party open-source local stdio server is
    also published at github.com/wappalyzer/mcp.
  humanURL: https://www.wappalyzer.com/docs/integrations/mcp/
