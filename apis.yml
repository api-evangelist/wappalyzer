- aid: wappalyzer:wappalyzer-metadata-api
  name: Wappalyzer Metadata API
  description: >-
    The four anonymous, unauthenticated technology and category reference endpoints on the v2
    host — the technology directory (7,281 entries), a single technology profile, the category
    directory (106 entries) and a single category with its member technologies. Absent from the
    published contract; located from the provider's own open-source MCP server and confirmed
    live on 2026-08-14. Consumes no credits and requires no API key.
  humanURL: https://www.wappalyzer.com/technologies/
  baseURL: https://api.wappalyzer.com/v2
